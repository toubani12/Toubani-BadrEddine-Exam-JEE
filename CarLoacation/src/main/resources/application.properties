spring.application.name=CarLoacation

server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:carrentaldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=badr
spring.datasource.password=badr
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# JWT (base64-encoded 256-bit secret; change in production)
app.jwt.secret=Y2hhbmdlLW1lLXBsZWFzZS1jaGFuZ2UtbWUtcGxlYXNlLWNoYW5nZS1tZS1wbGVhc2U=
app.jwt.expiration-ms=86400000

# Disable open-in-view warning
spring.jpa.open-in-view=false
